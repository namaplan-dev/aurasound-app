<html lang="en" class="dark">

    <meta charset="UTF-8" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="AuraSound" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <script>
      (function () {
        try {
          var raw = localStorage.getItem('aurasound_settings_v1');
          var theme = raw ? JSON.parse(raw).themeMode : 'dark';
          if (theme === 'light') document.documentElement.classList.remove('dark');
          else document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-zinc-50 text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100 antialiased selection:bg-amber-500/25">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
