name: Build AuraSound Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Full Standalone APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build production web bundle
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Set up JDK 21 for Android Gradle 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Ensure Android SDK licenses accepted
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Read app version
        id: meta
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "apk_name=AuraSound-v${VER}-b${{ github.run_number }}.apk" >> "$GITHUB_OUTPUT"

      - name: Prepare APK output
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-apk/${{ steps.meta.outputs.apk_name }}"
          ls -lh "release-apk/${{ steps.meta.outputs.apk_name }}"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraSound-v${{ steps.meta.outputs.version }}-b${{ github.run_number }}-APK
          path: release-apk/${{ steps.meta.outputs.apk_name }}
          if-no-files-found: error

      - name: Publish versioned APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v${{ steps.meta.outputs.version }}-b${{ github.run_number }}
          name: AuraSound v${{ steps.meta.outputs.version }} (Build #${{ github.run_number }})
          body: Standalone AuraSound Android APK v${{ steps.meta.outputs.version }} (Build #${{ github.run_number }}) with safe-area screen fit, taller floating bottom player, default slide-up/down full-screen player, 2 home screen widgets (4×1 Top Bar & 4×2 Studio Deck), and native local music scanning.
          files: release-apk/${{ steps.meta.outputs.apk_name }}
          make_latest: true
